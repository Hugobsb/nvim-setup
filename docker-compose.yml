services:
  nvim:
    image: nvim-setup
    build: .
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ${WORKSPACE:-.}
        target: /workspace
      - nvim-data:/root/.local/share/nvim
      - nvim-state:/root/.local/state/nvim
      - type: bind
        source: ${HOME}/.gitconfig
        target: /root/.gitconfig
        read_only: true
      - type: bind
        source: ${HOME}/.ssh
        target: /root/.ssh
        read_only: true
    working_dir: /workspace
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor

volumes:
  nvim-data:
  nvim-state:
